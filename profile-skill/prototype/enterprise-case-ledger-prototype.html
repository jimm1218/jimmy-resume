<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE - Business Examples Resume</title>
  <link rel="stylesheet" href="./enterprise-case-ledger-prototype.css">
</head>
<body>
  <!-- PROTOTYPE - throwaway UI. Three business-example resume variants, switchable via ?variant=A/B/C. -->
  <main id="app"></main>

  <nav class="prototype-switcher" aria-label="Prototype variants">
    <button type="button" id="prevVariant" aria-label="Previous variant">‹</button>
    <span id="variantLabel">A — Business Examples</span>
    <button type="button" id="nextVariant" aria-label="Next variant">›</button>
  </nav>

  <script>
    const variants = {
      A: {
        label: "A — Business Examples",
        render: renderVariantA
      },
      B: {
        label: "B — Timeline Evidence",
        render: renderVariantB
      },
      C: {
        label: "C — Dossier Split",
        render: renderVariantC
      }
    };

    const cases = [
      {
        rank: "01",
        name: "王品餐飲",
        title: "CDP 導入與會員標籤體系",
        stack: "Presto SQL · T-SQL · CTE · Window Functions · Power BI",
        problem: "多品牌會員資料與行銷分群條件複雜，行銷與營運需要一致的會員資料口徑。",
        action: "梳理需求與資料表對接，封裝 SQL 邏輯，建立會員標籤模組與可重複使用的 pipeline SQL。",
        value: "支援 CDP 上線、會員生命週期分析與 Power BI 教育訓練，推動資料驅動決策。",
        signal: "CRM/CDP depth"
      },
      {
        rank: "02",
        name: "向上國際科技",
        title: "風控資料自動化",
        stack: "Stored Procedures · SQL · 排程腳本 · Email Pipeline · SOP",
        problem: "線上遊戲異常轉帳與非法套利需要每日持續辨識與跨部門處理。",
        action: "撰寫 Stored Procedures 與排程腳本，建立資料抓取、查詢結果派送與風險稽核 SOP。",
        value: "將風控稽核資料自動送達決策者，提升異常事件追蹤與處理效率。",
        signal: "SQL automation"
      },
      {
        rank: "03",
        name: "FILA 斐樂",
        title: "會員健康度與 CRM BI",
        stack: "SQL Server · BigQuery · Power BI · DAX · Power Query M",
        problem: "會員健康度與營運報表依賴人工彙整，指標口徑分散。",
        action: "整合會員交易、行為與 CDP 資料，設計 RFM、回購、留存與流失預警 KPI。",
        value: "會員健康度週期報表自動化，人工彙整時間降低 80% 以上。",
        signal: "80%+ reporting reduction"
      }
    ];

    const portfolio = {
      title: "GROUP-PROJECT：AI 輿情監測與品牌回覆平台 Repuguard",
      context: "中興大學 AI 人工智慧與數據分析應用班 · Main project: GROUP-PROJECT（private repo）",
      demo: "https://repuguard.ai-future2026.com/",
      summary: "建立 AI 輿情監測與品牌回覆平台，整合 FastAPI、Dashboard、Supabase、ML 風險判斷模型、LLM API、Docker、GCP VM、Nginx HTTPS、PWA 與 GitHub Actions。",
      support: ["Price Inquiry", "Taiwan Windy", "ML workflow"]
    };

    function shell(pageOne, pageTwo) {
      return `
        <section class="page page-one">${pageOne}<footer class="page-footer"><span>Jimmy Chin · Public Resume</span><b>PAGE 01</b></footer></section>
        <section class="page page-two">${pageTwo}<footer class="page-footer"><span>Enterprise Examples · Portfolio</span><b>PAGE 02</b></footer></section>
      `;
    }

    function headerBlock(extra = "") {
      return `
        <header class="masthead">
          <div>
            <p class="eyebrow">BI-first public resume prototype</p>
            <h1>靳鈞評 <span>Jimmy Chin</span></h1>
            <p class="role">BI 分析師 / 資料分析師 / AI 應用資料分析</p>
            <p class="promise">把會員、營運與市場資料轉成可追蹤、可維運的決策工具</p>
          </div>
          <address>台中市<br><a href="mailto:jimm1218@gmail.com">jimm1218@gmail.com</a><br><a href="https://github.com/jimm1218">github.com/jimm1218</a></address>
        </header>
        ${extra}
      `;
    }

    function compactProfile() {
      return `
        <section class="metrics">
          <article><strong>8+ 年</strong><span>商業數據分析、CRM/CDP 與市場研究</span></article>
          <article><strong>80%+</strong><span>FILA 會員健康度報表人工彙整時間降幅</span></article>
          <article><strong>30+ 件</strong><span>獨立執行市場研究與分析專案</span></article>
        </section>
        <section class="summary">
          <h2>定位</h2>
          <p>具 8 年以上商業數據分析、CRM/CDP、SQL 與 Power BI 經驗，擅長把跨部門需求轉成資料邏輯、KPI、管理儀表板與決策報告。近期以 GROUP-PROJECT 將分析能力延伸至可部署 AI / BI 資料產品。</p>
        </section>
        <section class="skills-band">
          <span>Power BI / DAX</span><span>SQL / ETL</span><span>CRM / CDP</span><span>RFM / 留存</span><span>FastAPI</span><span>Supabase</span><span>Docker / GCP</span>
        </section>
      `;
    }

    function careerCompact() {
      return `
        <section>
          <div class="section-heading"><h2>職涯主線</h2><span>Career</span></div>
          <div class="career-grid">
            <article><time>2024-2026</time><b>FILA 數據分析師</b><p>會員健康度 BI、DAX KPI、SQL Server / CDP / BigQuery。</p></article>
            <article><time>2023-2024</time><b>向上國際科技 專案管理師</b><p>Stored Procedures、排程腳本、風控資料 pipeline。</p></article>
            <article><time>2020-2023</time><b>王品餐飲 數位組主任</b><p>CDP 導入、會員標籤、Presto SQL / T-SQL。</p></article>
            <article><time>2018-2020</time><b>東森得易購 經營分析專員</b><p>通路績效、VBA 報表自動化、活動成效分析。</p></article>
          </div>
          <p class="research-note">早期研究：循證民調 30+ 市調專案；逢甲 / 中央大學空間資訊與災害風險研究。</p>
        </section>
        <section class="page-one-bottom">
          <article>
            <h2>學歷</h2>
            <p><b>逢甲大學</b> 都市計畫與空間資訊碩士<br><b>中國文化大學</b> 土地資源學士</p>
          </article>
          <article>
            <h2>設計版第二頁重點</h2>
            <p>企業實例順序：王品 → 向上 → FILA。作品集區塊以 GROUP-PROJECT / Repuguard 為主作品。</p>
          </article>
          <article>
            <h2>證照與語言</h2>
            <p>Microsoft Certified: Introduction to Python for Data Science<br>中文精通；英文中等；台語中等</p>
          </article>
        </section>
      `;
    }

    function portfolioBlock(mode = "wide") {
      return `
        <section class="portfolio ${mode}">
          <p class="eyebrow">Portfolio lead</p>
          <h2>${portfolio.title}</h2>
          <p class="meta">${portfolio.context}</p>
          <p>${portfolio.summary}</p>
          <a href="${portfolio.demo}">${portfolio.demo}</a>
          <div class="supporting">
            ${portfolio.support.map((item) => `<span>${item}</span>`).join("")}
          </div>
        </section>
      `;
    }

    function renderVariantA() {
      const caseRows = cases.map((item) => `
        <article class="ledger-row dense">
          <div class="ledger-id"><b>${item.rank}</b><span>${item.signal}</span></div>
          <div class="ledger-main">
            <div class="case-title"><h2>${item.name}｜${item.title}</h2><p>${item.stack}</p></div>
            <div class="case-columns">
              <p><b>問題</b>${item.problem}</p>
              <p><b>作法</b>${item.action}</p>
              <p><b>價值</b>${item.value}</p>
            </div>
          </div>
        </article>
      `).join("");

      return shell(
        `${headerBlock()}${densePageOne()}`,
        `<header class="ledger-title">
          <div><p class="eyebrow">Page 02 / Business examples</p><h1>企業實例</h1></div>
          <p>以王品、向上、FILA 三個實例呈現 CDP / SQL 自動化 / BI 儀表板能力；作品集則展示近期 AI 應用成果。</p>
        </header>
        <section class="ledger dense-ledger">${caseRows}</section>${densePortfolioBoard()}`
      );
    }

    function densePageOne() {
      return `
        <section class="dense-hero">
          <div class="dense-claim">
            <p class="eyebrow">BI-first</p>
            <h2>從企業會員資料、營運風控到 AI 資料產品</h2>
            <p>具 8 年以上商業數據分析、CRM/CDP、SQL 與 Power BI 經驗，擅長把跨部門需求轉成資料邏輯、KPI、管理儀表板與決策報告。</p>
          </div>
          <div class="dense-metrics">
            <article><strong>8+ 年</strong><span>商業數據分析、CRM/CDP、市場研究</span></article>
            <article><strong>80%+</strong><span>FILA 報表人工彙整時間降幅</span></article>
            <article><strong>30+ 件</strong><span>市場研究與民意分析專案</span></article>
          </div>
        </section>
        <section class="dense-body">
          <div class="dense-career">
            <div class="section-heading"><h2>職涯主線</h2><span>Career</span></div>
            <article><time>2024-2026</time><h3>FILA 斐樂｜數據分析師</h3><p>會員健康度 BI、DAX KPI、SQL Server / CDP / BigQuery；人工彙整時間降低 80%+。</p></article>
            <article><time>2023-2024</time><h3>向上國際科技｜專案管理師</h3><p>Stored Procedures、排程腳本、異常交易掃描、風控資料 pipeline 與 SOP。</p></article>
            <article><time>2020-2023</time><h3>王品餐飲｜數位組主任</h3><p>CDP 導入、會員標籤模組、Presto SQL / T-SQL、會員生命週期分析。</p></article>
            <article><time>2018-2020</time><h3>東森得易購｜經營分析專員</h3><p>通路績效監控、VBA 報表自動化、會員輪廓與活動成效分析。</p></article>
          </div>
          <aside class="dense-side">
            <section>
              <h2>核心能力</h2>
              <div class="dense-tags">
                <span>Power BI / DAX</span><span>Power Query</span><span>SQL / ETL</span><span>CRM / CDP</span><span>RFM / 留存</span><span>FastAPI</span><span>Supabase</span><span>Docker / GCP</span>
              </div>
            </section>
            <section>
              <h2>早期研究</h2>
              <p>循證民調 30+ 市調專案；逢甲 / 中央大學空間資訊與災害風險研究。</p>
            </section>
            <section>
              <h2>學歷與證照</h2>
              <p><b>逢甲大學</b> 都市計畫與空間資訊碩士<br><b>中國文化大學</b> 土地資源學士</p>
              <p>Microsoft Certified: Introduction to Python for Data Science</p>
            </section>
          </aside>
        </section>
        <section class="first-page-depth">
          <div class="section-heading"><h2>能力輪廓</h2><span>Profile depth</span></div>
          <p class="capability-intro">我主要處理的是企業資料從「問題不清楚」到「可以被追蹤與交付」的過程，能力集中在需求拆解、資料流程、BI 呈現與 AI 應用整合。</p>
          <div class="capability-matrix">
            <article>
              <b>資料問題拆解</b>
              <p><span>需求訪談</span><span>欄位邏輯</span><span>KPI 定義</span></p>
              <small>王品 CDP 與 FILA 會員健康度專案，將會員經營問題轉成可追蹤指標。</small>
            </article>
            <article>
              <b>自動化與資料流程</b>
              <p><span>SQL / ETL</span><span>排程</span><span>資料清理</span></p>
              <small>向上風控資料派送與 FILA 報表流程，降低重複性彙整與人工交接成本。</small>
            </article>
            <article>
              <b>BI 呈現與決策溝通</b>
              <p><span>Power BI</span><span>DAX</span><span>決策摘要</span></p>
              <small>把分析結果整理成管理儀表板、教育訓練與跨部門可讀的追蹤報告。</small>
            </article>
            <article>
              <b>AI 應用與系統整合</b>
              <p><span>FastAPI</span><span>Supabase</span><span>Docker / GCP</span></p>
              <small>在 GROUP-PROJECT 中整合 ML 風險判斷、LLM API、Dashboard 與雲端部署。</small>
            </article>
          </div>
        </section>
      `;
    }

    function densePortfolioBoard() {
      return `
        <section class="portfolio-board">
          <header class="portfolio-heading">
            <div>
              <p class="eyebrow">Portfolio</p>
              <h1>作品集</h1>
            </div>
            <p>主作品展示近期 AI 應用整合能力；支援作品補充爬蟲、資料視覺化與機器學習流程。</p>
          </header>
          <div class="portfolio-lead">
            <p class="eyebrow">Lead work</p>
            <h2>${portfolio.title}</h2>
            <p class="meta">${portfolio.context}</p>
            <div class="portfolio-facts">
              <p><b>定位</b><span>AI 輿情監測、品牌回覆建議、評論風險分級</span></p>
              <p><b>角色</b><span>資料流程、API 串接、Dashboard、部署文件與團隊整合</span></p>
              <p><b>Demo</b><span><a href="${portfolio.demo}">${portfolio.demo}</a></span></p>
            </div>
            <ol class="portfolio-deliverables">
              <li><b>資料與後端</b><span>FastAPI、Supabase、資料庫寫回、API proxy 與後端服務切分。</span></li>
              <li><b>AI 應用</b><span>ML 風險判斷模型、Gemini / HuggingFace API 串接、回覆建議流程。</span></li>
              <li><b>產品呈現</b><span>Dashboard、PWA、評論監測、品牌回覆與可公開展示的成果站。</span></li>
              <li><b>部署維運</b><span>Docker、GCP VM、Nginx HTTPS、GitHub Actions 與部署 SOP。</span></li>
            </ol>
          </div>
          <div class="portfolio-support">
            <p class="eyebrow">Supporting works</p>
            <article><b>Price Inquiry</b><small>爬蟲 / 比價 / Dashboard</small><span>Python、Playwright；支援搜尋、篩選、排序與匯率換算。</span></article>
            <article><b>Taiwan Windy</b><small>資料視覺化 / 地圖</small><span>Leaflet、Canvas、IDW、Flask / SQLite；呈現熱力圖、風場動畫與時間軸。</span></article>
            <article><b>ML workflow</b><small>機器學習流程</small><span>CRISP-DM、EDA、特徵工程、模型比較、指標輸出與 joblib 模型檔。</span></article>
          </div>
        </section>
      `;
    }

    function renderVariantB() {
      const timeline = cases.map((item) => `
        <article class="timeline-row">
          <div class="timeline-marker"><span>${item.rank}</span></div>
          <div class="timeline-card">
            <p class="meta">${item.signal}</p>
            <h2>${item.name}</h2>
            <h3>${item.title}</h3>
            <p>${item.action}</p>
            <strong>${item.value}</strong>
            <small>${item.stack}</small>
          </div>
        </article>
      `).join("");

      return shell(
        `${headerBlock(`<section class="hero-statement"><b>BI-first</b><span>從企業資料問題到 AI 資料產品</span></section>`)}${compactProfile()}${careerCompact()}`,
        `<header class="page-title split-title"><div><p class="eyebrow">Timeline evidence</p><h1>從會員資料到自動化風控</h1></div><p>時間軸式閱讀，讓企業實例像一串已交付的證據，而不是職務條列。</p></header>
        <section class="timeline">${timeline}</section>${portfolioBlock("timeline-portfolio")}`
      );
    }

    function renderVariantC() {
      const dossierCases = cases.map((item) => `
        <article class="mini-dossier">
          <span>${item.rank}</span>
          <h2>${item.name}</h2>
          <h3>${item.title}</h3>
          <p>${item.value}</p>
        </article>
      `).join("");

      return shell(
        `${headerBlock()}<section class="dossier-hero"><div><h2>主張</h2><p>我不是只會做報表，而是能把會員經營、營運風險與品牌聲譽問題拆成資料流程、KPI 與可維運系統的人。</p></div><div>${compactProfile()}</div></section>${careerCompact()}`,
        `<section class="dossier-page">
          <aside>
            <p class="eyebrow">Dossier split</p>
            <h1>案例卷宗</h1>
            <p>左側固定主軸，右側用三個企業實例建立可信度；作品集獨立放在下方，GROUP-PROJECT 是主作品。</p>
            ${portfolioBlock("dossier-portfolio")}
          </aside>
          <div class="dossier-list">${dossierCases}</div>
        </section>`
      );
    }

    function getVariant() {
      const key = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variants[key] ? key : "A";
    }

    function setVariant(key) {
      const params = new URLSearchParams(location.search);
      params.set("variant", key);
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      render();
    }

    function shiftVariant(delta) {
      const keys = Object.keys(variants);
      const current = getVariant();
      const index = keys.indexOf(current);
      const next = keys[(index + delta + keys.length) % keys.length];
      setVariant(next);
    }

    function render() {
      const key = getVariant();
      document.getElementById("app").innerHTML = variants[key].render();
      document.getElementById("variantLabel").textContent = variants[key].label;
    }

    document.getElementById("prevVariant").addEventListener("click", () => shiftVariant(-1));
    document.getElementById("nextVariant").addEventListener("click", () => shiftVariant(1));
    window.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      if (active && (active.matches("input, textarea") || active.isContentEditable)) return;
      if (event.key === "ArrowLeft") shiftVariant(-1);
      if (event.key === "ArrowRight") shiftVariant(1);
    });

    render();
  </script>
</body>
</html>
